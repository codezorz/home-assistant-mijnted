[project]
name = "mijnted-ha-native-tests"
version = "0.0.0"
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "homeassistant==2026.11.0",
    "pytest-homeassistant==2026.11.0",
    # Integration runtime inputs; versions are resolved with HA's constraints.
    "aiohttp",
    "PyJWT",
    "pkce",
    "requests",
    "voluptuous",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
