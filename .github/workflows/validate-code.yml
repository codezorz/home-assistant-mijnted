name: Validate code

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
            custom_components/mijnted/manifest.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          python -m uv export --locked --no-hashes --no-emit-project --format requirements-txt --output-file requirements_test.txt
          python -m pip install -r requirements_test.txt
          python - <<'PY'
          import json
          import subprocess
          import sys

          with open("custom_components/mijnted/manifest.json", encoding="utf-8") as file:
              manifest = json.load(file)

          requirements = manifest.get("requirements", [])
          if requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY

      - name: Syntax check
        run: python -m compileall custom_components/mijnted .github/scripts

      - name: Run test suite
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Publish test report
    needs: test
    if: always() && needs.test.result != 'skipped' && needs.test.result != 'cancelled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      # This fresh runner only parses the report artifact; it never checks out PR code.
      - name: Publish test report
        uses: dorny/test-reporter@b94dfe179d7ff66342276f4bd6b82c3c0f659f52 # v1
        with:
          name: Pytest Results
          artifact: pytest-results
          path: pytest-results.xml
          reporter: java-junit
          fail-on-empty: false
