name: Publish betas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Both publishers share this lock. Reconciliation recovers superseded pending runs.
concurrency:
  group: mijnted-release-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
      - name: Validate and publish all pending commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/release.py beta
